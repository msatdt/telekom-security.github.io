<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Open directory listing of an exposed command-and-control server showing operator working directories">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e20074" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e20074" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#151c28"/>
      <stop offset="100%" stop-color="#0e131d"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .name { fill: #edf3fb; font-size: 21px; }
      .dir  { fill: #ff82bf; font-size: 21px; }
      .meta { fill: #8b97a8; font-size: 17px; }
      .head { fill: #5f6b7d; font-size: 17px; }
      .url  { fill: #aab5c5; font-size: 16px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="190" cy="60" rx="660" ry="400" fill="url(#glow)"/>

  <!-- browser window -->
  <g>
    <rect x="72" y="64" width="1056" height="502" rx="16" fill="#10151f" stroke="#2c3949" stroke-width="1.5"/>
    <path d="M72 80a16 16 0 0 1 16-16h1024a16 16 0 0 1 16 16v36H72z" fill="url(#chrome)"/>
    <line x1="72" y1="116" x2="1128" y2="116" stroke="#2c3949" stroke-width="1.5"/>

    <circle cx="104" cy="90" r="6" fill="#3a485d"/>
    <circle cx="126" cy="90" r="6" fill="#3a485d"/>
    <circle cx="148" cy="90" r="6" fill="#3a485d"/>

    <!-- address bar with open padlock -->
    <rect x="180" y="76" width="700" height="28" rx="14" fill="#080b12" stroke="#2c3949"/>
    <g stroke="#ff4aa2" stroke-width="1.8" fill="none" stroke-linecap="round">
      <rect x="199" y="89" width="13" height="10" rx="2.5" fill="#ff4aa2" stroke="none"/>
      <path d="M201.5 89v-3.2a4.2 4.2 0 0 1 8.4 0"/>
    </g>
    <text class="mono url" x="224" y="95">http://13.210.186[.]13/</text>

    <!-- listing -->
    <text class="mono" x="112" y="176" fill="#edf3fb" font-size="40" font-weight="700">Index of /</text>
    <line x1="112" y1="200" x2="184" y2="200" stroke="#ff4aa2" stroke-width="3" stroke-linecap="round"/>

    <text class="mono head" x="112" y="238">Name</text>
    <text class="mono head" x="760" y="238">Last modified</text>
    <text class="mono head" x="1088" y="238" text-anchor="end">Size</text>
    <line x1="112" y1="252" x2="1088" y2="252" stroke="#222d3c" stroke-width="1"/>

    <g>
      <text class="mono name" x="112" y="286">.bash_history</text>
      <text class="mono meta" x="760" y="286">2026-04-22 06:53</text>
      <text class="mono meta" x="1088" y="286" text-anchor="end">12K</text>

      <text class="mono dir"  x="112" y="318">.vscode-server/</text>
      <text class="mono meta" x="760" y="318">2026-04-22 07:11</text>
      <text class="mono meta" x="1088" y="318" text-anchor="end">-</text>

      <text class="mono name" x="112" y="350">c18</text>
      <text class="mono meta" x="760" y="350">2026-03-04 07:55</text>
      <text class="mono meta" x="1088" y="350" text-anchor="end">5.0M</text>

      <text class="mono dir"  x="112" y="382">df/</text>
      <text class="mono meta" x="760" y="382">2026-04-22 07:05</text>
      <text class="mono meta" x="1088" y="382" text-anchor="end">-</text>

      <text class="mono dir"  x="112" y="414">dnslog/</text>
      <text class="mono meta" x="760" y="414">2026-04-22 07:05</text>
      <text class="mono meta" x="1088" y="414" text-anchor="end">-</text>

      <text class="mono dir"  x="112" y="446">httplog/</text>
      <text class="mono meta" x="760" y="446">2026-04-22 07:05</text>
      <text class="mono meta" x="1088" y="446" text-anchor="end">-</text>

      <text class="mono dir"  x="112" y="478">nmap/</text>
      <text class="mono meta" x="760" y="478">2026-04-22 07:05</text>
      <text class="mono meta" x="1088" y="478" text-anchor="end">-</text>

      <text class="mono dir"  x="112" y="510">wget/</text>
      <text class="mono meta" x="760" y="510">2026-04-22 07:05</text>
      <text class="mono meta" x="1088" y="510" text-anchor="end">-</text>

      <text class="mono dir"  x="112" y="542">xserver/</text>
      <text class="mono meta" x="760" y="542">2026-04-22 07:13</text>
      <text class="mono meta" x="1088" y="542" text-anchor="end">-</text>
    </g>
  </g>
</svg>
